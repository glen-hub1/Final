<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Certificate</title><link rel='stylesheet' href='style.css'></head><body><section class='section'><div class='glass-card' style='text-align:center'><h1>Certificate of Completion</h1><p>This certificate is proudly presented to</p><input id='name-input' placeholder='Enter your full name'><h2 id='certificate-name'>Your Name Here</h2><button class='btn primary' onclick="document.getElementById('certificate-name').textContent=document.getElementById('name-input').value||'Your Name Here'">Apply Name</button><button class='btn secondary' onclick='window.print()'>Download Certificate</button></div></section></body></html>
